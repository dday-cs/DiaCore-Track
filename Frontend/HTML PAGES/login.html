<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Diacore</title>
    <link rel="stylesheet" href="../css/loginstyle.css">
</head>
<body>
    <div class="dots">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="header">
        <p class="subtitle ">Sign in to continue...</p>
        <div class="brand">Diacore</div>
    </div>

    <div class="card">
        <div class="logo-wrap">
            <div class="logo-icon">
                <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <image href="../assets/images/LOGO.png" x="-20" y="-15" width="100" height="100" />
                </svg>
            </div>
        </div>
        
        <form action="">
            <div class="field">
                <label for="LogInEmail">Email</label>
                <input type="email" id="LogInEmail" placeholder="Email">
            </div>

            <div class="field">
                <label for="LPassword">Password</label>
                <input type="password" id="LPassword" placeholder="">
            </div>
        
            <button type="button" class="btn-login" id="btn2">
                Login
            </button>
        </form>

        <div class="divider"><span>or</span></div>
        <button class="btn-google" id="googleBtn">
        <!--This section is from claude.ai I used it to enchance the code-->
            <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13 17.8 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.1z"/>
                <path fill="#FBBC05" d="M10.5 28.6A14.8 14.8 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.1A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.9-6.1z"/>
                <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.6-5.9c-2 1.4-4.6 2.2-7.6 2.2-6.2 0-11.5-4.2-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/>
            </svg>
        Continue with Google
        </button>
    
        <p class="signup-link"> Don't have an account? <a href="signup.html">Sign Up</a>  </p>
    
    </div>
    <script type="module" src="../js/DiacorJSLogIn.js"></script>
</body>
</html>
